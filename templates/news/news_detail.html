{% extends 'base.html' %}
{% block title %}{{ item.title }} — Новости{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'news:list' %}">Новости</a></li>
    <li class="breadcrumb-item active">{{ item.title }}</li>
  </ol>
</nav>

<article>
  <h1 class="h3">{{ item.title }}</h1>
  <div class="text-muted mb-3"><i class="bi bi-calendar3"></i> {{ item.date|date:"d.m.Y" }}</div>
  {% if item.picture %}
  <img src="{{ item.picture.url }}" class="img-fluid rounded mb-3" style="max-height:420px;object-fit:cover;" alt="{{ item.title }}">
  {% endif %}
  <div style="white-space: pre-line;">{{ item.text }}</div>
</article>

<a href="{% url 'news:list' %}" class="btn btn-link mt-3"><i class="bi bi-arrow-left"></i> Все новости</a>
{% endblock %}
