<div class="table-responsive">
  <table class="table table-sm table-hover align-middle mb-0">
    <thead class="table-light">
      <tr><th>{{ col_label }}</th><th class="text-end" style="width:8rem">Расход</th></tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>
          {% if link_type == 'product' and r.pk %}<a href="{% url 'catalog:product_detail' r.pk %}" class="text-decoration-none">{{ r.label }}</a>
          {% elif link_type == 'model' and r.pk %}<a href="{{ model_link_base }}{{ r.pk }}" class="text-decoration-none">{{ r.label }}</a>
          {% else %}{{ r.label }}{% endif %}
          {% if r.sku %}<div class="small text-muted">{{ r.sku }}</div>{% endif %}
        </td>
        <td class="text-end">{{ r.qty|floatformat:"-3" }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="2" class="text-muted text-center py-3">Нет данных.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
