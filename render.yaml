services:
  - type: web
    name: ams-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_BUYER_PASSWORD
        value: demo12345
